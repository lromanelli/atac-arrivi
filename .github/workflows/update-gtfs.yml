name: Aggiorna orari GTFS

on:
  schedule:
    - cron: '30 2 * * *'   # ogni notte alle 04:30 UTC (= 06:30 ora italiana)
  workflow_dispatch:         # permette avvio manuale dalla UI di GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica GTFS statico ATAC Roma
        run: |
          echo "Download GTFS in corso..."
          curl -L --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (compatible; ATAC-GTFS-Updater/1.0)" \
            -o gtfs.zip \
            "https://romamobilita.it/sites/default/files/rome_static_gtfs.zip"
          echo "Dimensione: $(du -h gtfs.zip | cut -f1)"

      - name: Genera file JSON per ogni fermata
        run: python scripts/generate_stops.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Distribuisci su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
